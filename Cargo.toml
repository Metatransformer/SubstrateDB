[package]
name = "substratedb"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
description = "An integrated document, messaging, search and realtime runtime"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
croner = "2"
futures-util = "0.3"
hmac = "0.12"
openraft = { version = "0.9.21", features = ["serde", "storage-v2"] }
redb = "=2.6.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "substrate"
path = "src/main.rs"
